<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moji termini – Edi Barbershop</title>
  <meta name="theme-color" content="#201f20">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-title="title_racun">

  <header class="top">
    <a class="logo" href="index.html"><img class="logo-img" src="icon-192.png" alt="">Edi Barbershop</a>
    <div class="desno">
      <nav><a href="index.html" data-i18n="nav_naruci">Naruči termin</a></nav>
      <div class="jezik" role="group" aria-label="Jezik / Language">
        <button type="button" data-lang="hr">HR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main>
    <!-- 1. Izbor: prijava ili novi račun -->
    <section id="izbor" class="narudzba" style="margin-top:50px">
      <h2 data-i18n="moj_racun">Moj račun</h2>
      <div class="izbor">
        <button class="btn" type="button" id="bPrijava" data-i18n="prijavi_se">Prijavi se</button>
        <button class="btn-otkazi" type="button" id="bRegistracija" data-i18n="novi_racun">Napravi novi račun</button>
      </div>
      <p class="greska" id="izborPoruka" role="status"></p>
    </section>

    <!-- 2. Prijava -->
    <section id="prijava" class="narudzba" style="margin-top:50px" hidden>
      <h2 data-i18n="prijavi_se">Prijavi se</h2>
      <form id="prijavaForma">
        <label><span data-i18n="lbl_email">Email</span>
          <input type="email" id="lEmail" required autocomplete="username">
        </label>
        <label><span data-i18n="lbl_lozinka">Lozinka</span>
          <input type="password" id="lLozinka" required autocomplete="current-password">
        </label>
        <button class="btn" type="submit" data-i18n="prijavi_se">Prijavi se</button>
        <button class="btn-otkazi sivo" type="button" id="zaboravljena" data-i18n="zaboravljena">Zaboravljena lozinka</button>
        <button class="btn-otkazi sivo natrag" type="button" data-i18n="natrag">Natrag</button>
        <p class="greska" id="lGreska" role="alert"></p>
      </form>
    </section>

    <!-- 3. Novi račun -->
    <section id="registracija" class="narudzba" style="margin-top:50px" hidden>
      <h2 data-i18n="novi_racun">Napravi novi račun</h2>
      <form id="registracijaForma">
        <label><span data-i18n="lbl_ime">Ime</span>
          <input type="text" id="rIme" required autocomplete="given-name">
        </label>
        <label><span data-i18n="lbl_tel">Broj mobitela</span>
          <input type="tel" id="rTel" required autocomplete="tel">
        </label>
        <label><span data-i18n="lbl_email">Email</span>
          <input type="email" id="rEmail" required autocomplete="username">
        </label>
        <label><span data-i18n="lbl_lozinka6">Lozinka (min. 6 znakova)</span>
          <input type="password" id="rLozinka" required minlength="6" autocomplete="new-password">
        </label>
        <button class="btn" type="submit" data-i18n="napravi_racun">Napravi račun</button>
        <button class="btn-otkazi sivo natrag" type="button" data-i18n="natrag">Natrag</button>
        <p class="greska" id="rGreska" role="alert"></p>
      </form>
    </section>

    <!-- Prijavljen korisnik -->
    <section id="panel" hidden style="padding-top:40px">
      <h1 data-i18n="moji_h">Moji termini</h1>
      <p class="prazno" id="tko"></p>
      <p style="margin:12px 0"><a class="btn" href="index.html#narudzba" data-i18n="naruci_novi">Naruči novi termin</a></p>
      <div id="lista"></div>

      <h2 style="margin:40px 0 16px" data-i18n="moji_podaci">Moji podaci</h2>
      <form id="podaciForma" class="narudzba">
        <label><span data-i18n="lbl_ime">Ime</span>
          <input type="text" id="podIme" required autocomplete="given-name">
        </label>
        <label><span data-i18n="lbl_tel">Broj mobitela</span>
          <input type="tel" id="podTel" required autocomplete="tel">
        </label>
        <button class="btn" type="submit" data-i18n="spremi">Spremi promjene</button>
        <p class="greska" id="podaciPoruka" role="status"></p>
      </form>
      <p style="margin-top:24px"><button class="btn-otkazi" id="odjava" data-i18n="odjava">Odjava</button></p>

      <p style="margin-top:40px"><button class="btn-otkazi" type="button" id="bObrisi" data-i18n="obrisi_h">Obriši račun</button></p>
      <div id="brisiBlok" hidden>
        <p class="prazno" data-i18n="obrisi_info">Brisanjem se trajno brišu tvoj račun, osobni podaci i svi tvoji termini. Ovo se ne može poništiti.</p>
        <form id="brisiForma" class="narudzba" style="margin-top:12px">
          <label><span data-i18n="lozinka_potvrda">Lozinka (za potvrdu)</span>
            <input type="password" id="brisiLozinka" required autocomplete="current-password">
          </label>
          <button class="btn-otkazi" type="submit" data-i18n="obrisi_gumb">Trajno obriši račun</button>
          <button class="btn-otkazi sivo" type="button" id="bOdustani" data-i18n="odustani">Odustani</button>
          <p class="greska" id="brisiPoruka" role="alert"></p>
        </form>
      </div>
    </section>
  </main>

  <script type="module">
    import { Store, Auth, Profil, provjeriTel } from './app.js';
    import { t, jezik } from './jezik.js';
    const $ = id => document.getElementById(id);
    const sekcije = ['izbor', 'prijava', 'registracija'];
    const pokazi = id => sekcije.forEach(s => { $(s).hidden = s !== id; });
    const poruci = (el, k, v, ok = false) => { el.textContent = k ? t(k, v) : ''; el.style.color = ok ? '#6fd39a' : ''; };
    const greskaKod = e => ({ 'auth/email-already-in-use': 'e_postoji', 'auth/weak-password': 'e_slaba', 'auth/invalid-email': 'e_email' })[e.code] || 'e_login';
    let korisnik = null;

    $('bPrijava').addEventListener('click', () => pokazi('prijava'));
    $('bRegistracija').addEventListener('click', () => pokazi('registracija'));
    document.querySelectorAll('.natrag').forEach(b => b.addEventListener('click', () => pokazi('izbor')));

    $('prijavaForma').addEventListener('submit', async (e) => {
      e.preventDefault(); poruci($('lGreska'), '');
      try { await Auth.login($('lEmail').value.trim(), $('lLozinka').value); }
      catch (er) { poruci($('lGreska'), greskaKod(er)); }
    });
    $('registracijaForma').addEventListener('submit', async (e) => {
      e.preventDefault(); poruci($('rGreska'), '');
      const ime = $('rIme').value.trim(), tel = provjeriTel($('rTel').value);
      if (ime.length < 2) { poruci($('rGreska'), 'e_ime'); return; }
      if (!tel) { poruci($('rGreska'), 'm_tel'); return; }
      try {
        await Auth.register($('rEmail').value.trim(), $('rLozinka').value, ime, tel);
        $('podIme').value = ime; $('podTel').value = tel;
        opisi();
      } catch (er) { poruci($('rGreska'), greskaKod(er)); }
    });
    $('zaboravljena').addEventListener('click', async () => {
      const mail = $('lEmail').value.trim();
      if (!mail) { poruci($('lGreska'), 'e_email_prvo'); return; }
      try { await Auth.reset(mail); poruci($('lGreska'), 'reset_ok', { x: mail }, true); }
      catch { poruci($('lGreska'), 'reset_err'); }
    });

    $('podaciForma').addEventListener('submit', async (e) => {
      e.preventDefault();
      const por = $('podaciPoruka');
      const ime = $('podIme').value.trim(), tel = provjeriTel($('podTel').value);
      if (ime.length < 2) { poruci(por, 'e_ime'); return; }
      if (!tel) { poruci(por, 'm_tel'); return; }
      try {
        await Profil.set(Auth.user(), ime, tel);
        $('podTel').value = tel;
        opisi();
        poruci(por, 'podaci_ok', {}, true);
      } catch { poruci(por, 'spremanje_greska'); }
    });
    function brisiOtvori(otvori) {
      $('brisiBlok').hidden = !otvori;
      $('bObrisi').hidden = otvori;
      $('brisiLozinka').value = '';
      poruci($('brisiPoruka'), '');
      if (otvori) $('brisiLozinka').focus();
    }
    $('bObrisi').addEventListener('click', () => brisiOtvori(true));
    $('bOdustani').addEventListener('click', () => brisiOtvori(false));
    $('brisiForma').addEventListener('submit', async (e) => {
      e.preventDefault();
      const por = $('brisiPoruka'); poruci(por, '');
      if (!confirm(t('potvrdi_brisanje'))) return;
      try {
        await Auth.obrisiRacun($('brisiLozinka').value);
        $('brisiLozinka').value = '';
        poruci($('izborPoruka'), 'racun_obrisan', {}, true);
      } catch (er) {
        poruci(por, (er.code === 'auth/invalid-credential' || er.code === 'auth/wrong-password') ? 'kriva_lozinka' : 'brisanje_greska');
      }
    });
    $('odjava').addEventListener('click', () => Auth.logout());

    function opisi() {
      const u = Auth.user();
      if (u) $('tko').textContent = t('prijavljen_kao', { x: u.displayName || u.email });
    }
    async function ucitajPodatke(u) {
      let pr = null;
      try { pr = await Profil.get(u.uid); } catch {}
      $('podIme').value = (pr && pr.ime) || u.displayName || '';
      $('podTel').value = (pr && pr.tel) || '';
    }

    Auth.onChange(async u => {
      korisnik = u;
      if (!u) { $('panel').hidden = true; pokazi('izbor'); return; }
      sekcije.forEach(s => { $(s).hidden = true; });
      $('izborPoruka').textContent = '';
      $('panel').hidden = false;
      brisiOtvori(false);
      opisi();
      prikazi(u.uid);
      ucitajPodatke(u);
    });
    document.addEventListener('jezik', () => { if (korisnik) { opisi(); prikazi(korisnik.uid); } });

    async function prikazi(uid) {
      const lista = $('lista');
      lista.innerHTML = '';
      const danas = new Date().toLocaleDateString('sv-SE');
      let svi;
      try { svi = (await Store.mine(uid)).filter(x => x.datum >= danas).sort((a, b) => (a.datum + a.vrijeme).localeCompare(b.datum + b.vrijeme)); }
      catch { lista.innerHTML = '<p class="prazno">' + t('ne_mogu') + '</p>'; return; }
      lista.innerHTML = '';
      if (!svi.length) { lista.innerHTML = '<p class="prazno">' + t('nema_termina') + '</p>'; return; }
      const loc = jezik() === 'hr' ? 'hr-HR' : 'en-GB';
      svi.forEach(x => {
        const kartica = document.createElement('div');
        kartica.className = 'termin';
        const tekst = document.createElement('div');
        const naslov = document.createElement('strong');
        const dan = new Date(x.datum + 'T00:00').toLocaleDateString(loc, { weekday: 'long', day: 'numeric', month: 'long' });
        naslov.textContent = t('u_vrijeme', { d: dan, v: x.vrijeme });
        tekst.append(naslov, document.createElement('br'), x.usluga);
        const gumb = document.createElement('button');
        gumb.className = 'btn-otkazi';
        gumb.textContent = t('otkazi');
        gumb.onclick = async () => {
          if (confirm(t('potvrdi_otkaz', { d: x.datum, v: x.vrijeme }))) { await Store.remove(x.id); prikazi(uid); }
        };
        kartica.append(tekst, gumb);
        lista.append(kartica);
      });
    }
  </script>
</body>
</html>
