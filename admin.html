<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edi Frizer</title>
  <meta name="theme-color" content="#14213d">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest-admin.json">
  <link rel="icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <span class="logo">Edi Frizer</span>
    <nav><a href="#" id="odjava" hidden>Odjava</a></nav>
  </header>
  <div class="pole" aria-hidden="true"></div>

  <main>
    <section id="prijava" class="narudzba" style="margin-top:50px">
      <h2>Prijava za frizera</h2>
      <form id="prijavaForma">
        <label>Email
          <input type="email" id="email" required autocomplete="username">
        </label>
        <label>Lozinka
          <input type="password" id="lozinka" required autocomplete="current-password">
        </label>
        <button class="btn" type="submit">Prijavi se</button>
        <p id="greska" role="alert"></p>
      </form>
    </section>

    <section id="panel" hidden style="padding-top:40px">
      <h1>Zakazani termini</h1>
      <div id="lista"></div>
    </section>
  </main>

  <script type="module">
    import { Store, Auth } from './app.js';
    const lista = document.getElementById('lista');
    const greska = document.getElementById('greska');
    const odjava = document.getElementById('odjava');

    document.getElementById('prijavaForma').addEventListener('submit', async (e) => {
      e.preventDefault();
      greska.textContent = '';
      try { await Auth.login(document.getElementById('email').value, document.getElementById('lozinka').value); }
      catch { greska.textContent = 'Pogrešan email ili lozinka.'; }
    });
    odjava.addEventListener('click', (e) => { e.preventDefault(); Auth.logout(); });

    Auth.onChange(user => {
      document.getElementById('prijava').hidden = !!user;
      document.getElementById('panel').hidden = !user;
      odjava.hidden = !user;
      if (user) prikazi();
    });

    async function prikazi() {
      lista.innerHTML = '';
      let svi;
      try { svi = (await Store.all()).sort((a, b) => (a.datum + a.vrijeme).localeCompare(b.datum + b.vrijeme)); }
      catch { lista.innerHTML = '<p class="prazno">Nemaš dozvolu ili je došlo do greške.</p>'; return; }
      if (!svi.length) { lista.innerHTML = '<p class="prazno">Nema zakazanih termina.</p>'; return; }
      let dan = '';
      svi.forEach(t => {
        if (t.datum !== dan) {
          dan = t.datum;
          const h = document.createElement('h2');
          h.className = 'dan';
          h.textContent = new Date(t.datum + 'T00:00').toLocaleDateString('hr-HR', { weekday: 'long', day: 'numeric', month: 'long' });
          lista.append(h);
        }
        const kartica = document.createElement('div');
        kartica.className = 'termin';
        const tekst = document.createElement('div');
        const naslov = document.createElement('strong');
        naslov.textContent = `${t.vrijeme} – ${t.ime}`;
        tekst.append(naslov, document.createElement('br'), `${t.usluga} · ${t.tel}`);
        if (t.napomena) tekst.append(document.createElement('br'), 'Napomena: ' + t.napomena);
        const gumb = document.createElement('button');
        gumb.className = 'btn-otkazi';
        gumb.textContent = 'Otkaži termin';
        gumb.onclick = async () => {
          if (confirm(`Otkazati termin: ${t.ime}, ${t.vrijeme}?`)) { await Store.remove(t.id); prikazi(); }
        };
        kartica.append(tekst, gumb);
        lista.append(kartica);
      });
    }
  </script>
</body>
</html>
