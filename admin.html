<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edi Frizer</title>
  <meta name="theme-color" content="#201f20">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest-admin.json">
  <link rel="icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <span class="logo"><img class="logo-img" src="icon-192.png" alt="">Edi Frizer</span>
    <nav><a href="#" id="odjava" hidden>Odjava</a></nav>
  </header>

  <main>
    <section id="prijava" class="narudzba" style="margin-top:50px">
      <h2>Prijava za frizera</h2>
      <form id="prijavaForma">
        <label>Email
          <input type="email" id="email" required autocomplete="username">
        </label>
        <label>Lozinka
          <input type="password" id="lozinka" required autocomplete="current-password">
        </label>
        <button class="btn" type="submit">Prijavi se</button>
        <p id="greska" role="alert"></p>
      </form>
    </section>

    <section id="panel" hidden style="padding-top:40px">
      <h1 style="margin-bottom:20px">Termini</h1>
      <div id="kalendar"></div>
      <div class="dan-naslov"><h2 id="danNaslov"></h2><span class="prazno" id="danBroj"></span></div>
      <div id="lista"></div>
    </section>
  </main>

  <script type="module">
    import { Store, Auth } from './app.js';
    import { kalendar, ymd } from './kalendar.js';
    const $ = id => document.getElementById(id);
    const lista = $('lista'), greska = $('greska'), odjava = $('odjava');
    let svi = [], ucitano = false;

    $('prijavaForma').addEventListener('submit', async (e) => {
      e.preventDefault();
      greska.textContent = '';
      try { await Auth.login($('email').value, $('lozinka').value); }
      catch { greska.textContent = 'Pogrešan email ili lozinka.'; }
    });
    odjava.addEventListener('click', (e) => { e.preventDefault(); Auth.logout(); });

    // Kalendar: značka na danu = broj termina tog dana; klik na dan prikaže njegove termine
    const broj = d => svi.filter(t => t.datum === d).length;
    const kal = kalendar($('kalendar'), {
      loc: () => 'hr-HR',
      oznaka: d => broj(d) || '',
      odabir: prikaziDan
    });

    Auth.onChange(user => {
      $('prijava').hidden = !!user;
      $('panel').hidden = !user;
      odjava.hidden = !user;
      if (user) ucitaj(kal.odabrani() || ymd(new Date()));
    });
    // Kad se aplikacija ponovno otvori, povuci nove termine
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && Auth.user()) ucitaj(kal.odabrani());
    });

    async function ucitaj(dan) {
      try { svi = await Store.all(); ucitano = true; }
      catch { svi = []; ucitano = false; }
      kal.postavi(dan || ymd(new Date()));
      prikaziDan(kal.odabrani());
    }

    function prikaziDan(d) {
      lista.innerHTML = '';
      $('danNaslov').textContent = new Date(d + 'T00:00').toLocaleDateString('hr-HR', { weekday: 'long', day: 'numeric', month: 'long' });
      if (!ucitano) { $('danBroj').textContent = ''; lista.innerHTML = '<p class="prazno">Nemaš dozvolu ili je došlo do greške.</p>'; return; }
      const dan = svi.filter(t => t.datum === d).sort((a, b) => a.vrijeme.localeCompare(b.vrijeme));
      $('danBroj').textContent = dan.length ? `${dan.length} ${dan.length === 1 ? 'termin' : 'termina'}` : '';
      if (!dan.length) { lista.innerHTML = '<p class="prazno">Nema termina za taj dan.</p>'; return; }
      const sad = ymd(new Date()) + 'T' + new Date().toTimeString().slice(0, 5);
      dan.forEach(t => {
        const kartica = document.createElement('div');
        kartica.className = 'termin';
        const tekst = document.createElement('div');
        const naslov = document.createElement('strong');
        naslov.textContent = `${t.vrijeme} – ${t.ime}`;
        const tel = document.createElement('a');
        tel.href = 'tel:' + t.tel; tel.textContent = t.tel;
        tekst.append(naslov, document.createElement('br'), `${t.usluga} · `, tel);
        if (t.napomena) tekst.append(document.createElement('br'), 'Napomena: ' + t.napomena);
        kartica.append(tekst);
        if (t.datum + 'T' + t.vrijeme >= sad) { // prošli termini se ne mogu otkazati
          const gumb = document.createElement('button');
          gumb.className = 'btn-otkazi';
          gumb.textContent = 'Otkaži termin';
          gumb.onclick = async () => {
            if (confirm(`Otkazati termin: ${t.ime}, ${t.vrijeme}?`)) { await Store.remove(t.id); ucitaj(d); }
          };
          kartica.append(gumb);
        }
        lista.append(kartica);
      });
    }
  </script>
</body>
</html>
